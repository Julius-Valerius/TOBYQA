[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tobyqa"
version = "1.0.0"
description = "Time-augmented Optimization BY Quadratic Approximation for Noisy Time-Varying Derivative-Free Optimization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Haoyu Yao", email = "yaohaoyu@stu.xjtu.edu.cn" },
    { name = "Pengcheng Xie", email = "pxie@lbl.gov" }
]
keywords = [
    "derivative-free optimization",
    "black-box optimization",
    "noisy optimization",
    "time-varying optimization",
    "cubic regularization",
    "drift compensation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
benchmarks = [
    "pdfo>=2.0.0",
    "Py-BOBYQA>=1.4.0",
]

[tool.setuptools]
py-modules = [
    "TOBYQA",
    "KKT_posterior",
    "ARC_subproblem",
    "geometry_step",
    "bench_problems",
    "bench_solvers",
    "plot_style"
]
